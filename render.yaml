services:
  - type: web
    name: tata-dtm-management-reporting
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: DTM_ADMIN_KEY
        sync: false
